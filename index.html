<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:450px;
    min-height:100vh;
    background:#111;
    padding-bottom:95px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    background:#151515;
    border-bottom:1px solid #222;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:700;
    letter-spacing:1px;
    z-index:10;
}

/* CARD */

.character{
    margin:20px;
    background:#1b1b1b;
    border:1px solid #2a2a2a;
    border-radius:22px;
    overflow:hidden;
}

.banner{
    height:180px;
    background:url("https://picsum.photos/700/500?grayscale") center/cover;
}

.content{
    padding:22px;
    text-align:center;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    border:5px solid #1b1b1b;
    margin-top:-75px;
    object-fit:cover;
    background:#222;
}

.name{
    margin-top:15px;
    font-size:28px;
    font-weight:700;
}

.desc{
    margin-top:12px;
    color:#b8b8b8;
    line-height:1.6;
    font-size:15px;
}

.chat-btn{
    margin-top:22px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#2f7cff;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:not-allowed;
    opacity:.7;
}

/* BOTTOM NAV */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:450px;
    height:75px;
    background:#151515;
    border-top:1px solid #242424;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:#888;
    user-select:none;
}

.item svg{
    width:24px;
    height:24px;
    fill:#888;
}

.item.active{
    color:white;
}

.item.active svg{
    fill:white;
}

button{
    pointer-events:none;
}
</style>

</head>
<body>

<div class="container">

<div class="header">
N Chatbot
</div>

<div class="character">

<div class="banner"></div>

<div class="content">

<img class="avatar"
src="https://picsum.photos/300"
alt="Character">

<div class="name">
N Assistant
</div>

<div class="desc">
AI yang siap membantu menjawab pertanyaan, memberikan ide, membuat kode, hingga menemani percakapan kapan saja.
</div>

<button class="chat-btn">
💬 Chat Karakter
</button>

</div>

</div>

</div>

<!-- Bottom Navigation -->

<div class="bottom">

<div class="item active">

<svg viewBox="0 0 24 24">
<path d="M12 3l9 8h-3v10h-5v-6H11v6H6V11H3z"/>
</svg>

<span>Home</span>

</div>

<div class="item">

<svg viewBox="0 0 24 24">
<path d="M13 3a9 9 0 100 18 9 9 0 000-18zm1 5h-2v6l5 3 1-1.7-4-2.3V8z"/>
</svg>

<span>History</span>

</div>

<div class="item">

<svg viewBox="0 0 24 24">
<path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/>
</svg>

<span>Account</span>

</div>

</div>

</body>
</html>
